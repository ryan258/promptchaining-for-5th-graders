<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "Prompt Chaining" }}</title>
    <link rel="stylesheet" href="/static/candlelight.css" />
    <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"historyCacheSize":0,"selfRequestsOnly":true}' />
    <script src="/static/vendor/htmx-1.9.12.min.js" defer></script>
    <script src="/static/workbench.js" defer></script>
    <script src="/static/guides.js" defer></script>
    <script src="/static/advanced.js" defer></script>
  </head>
  <body class="page-{{ active_page or 'home' }}">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page-noise" aria-hidden="true"></div>
    <div class="shell">
      <header class="site-header">
        <a href="/" class="brand-lockup">
          <span class="brand-symbol" aria-hidden="true">⠿</span>
          <span><strong>Prompt Chaining Studio</strong><span class="brand-kicker">One thought leads to the next.</span></span>
        </a>
        {% if nav_items %}
          <nav class="site-nav" aria-label="Primary navigation">
            {% for item in nav_items %}
              <a href="{{ item.href }}" class="site-nav-link{% if item.active %} is-active{% endif %}"{% if item.active %} aria-current="page"{% endif %}>{{ item.label }}</a>
            {% endfor %}
          </nav>
        {% endif %}
      </header>
      <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
      <footer class="studio-footer"><span>Made for a curious mind. Saved on this computer.</span><span><a href="/studio/guides">Guides</a><span aria-hidden="true"> · </span><a href="/studio/guides/accessibility#keyboard-controls">Keyboard shortcuts</a><span aria-hidden="true"> · </span><a href="/studio/advanced">Advanced tools</a></span></footer>
    </div>
    <div class="toast" id="studio-message" role="status" aria-live="polite" hidden></div>
  </body>
</html>
